<!DOCTYPE html>
<html lang="en">
    <head>
        <title>INTERNAL MANAGER IFRAME</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="passwordsec">
            <h2>Enter the password</h2>
            <label>Password: </label>
            <input type="password" id="mainpwd">
            <br>
            <button onclick="checkpwd();">Check password</button>
            <p id="pwdstat">No password</p>
        </div>
        <div id="mainstuff" hidden>
            <h2>Connection status</h2>
            <div class="boxed">
                <!-- Just the status -->
                 <b>Signaling status: </b><div id="signalconn">Connecting...</div>
                 <br>
                 <b>Auth state: </b><div id="authstat">Unauthorized</div>
                 <br>
                <b>Direct connection state: </b>
                <div id="dcstat">Waiting on URL</div>
            </div>
            <h2>General info</h2>
            <div class="boxed">
                <b>Working status: </b>
                <div id="wstat">Awaiting connection</div>
                <br>
                <b>Progress: </b>
                <div id="gprog">Awaiting connection</div>
                <br>
                <b>Time taken: </b>
                <div id="rtime">Awaiting connection</div>
            </div>
            <h2>Image</h2>
            <div class="boxed">
                <button onclick="shImage(this);">Show other images</button>
                <div id="mimgw"><img id="mimg" alt="Please wait..."></div>
                <div hidden id="advancedImg">
                    <h3>Large</h3>
                    <img id="imgl" alt="Please wait...">
                    <h3>Medium</h3>
                    <img id="imgm" alt="Please wait...">
                    <h3>Small</h3>
                    <img id="imgs" alt="Please wait...">
                </div>
            </div>
        </div>
        <br>
        <button onclick="askAuth():">REAUTH</button>
        <script src="main.js"></script>
    </body>
</html>
