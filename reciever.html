<html lang="en">
    <head>
        <title>THE RECIEVER</title>
        <style>
            body {
                font-family: 'Courier New', monospace;
            }
            #status {
                border: 5px solid black;
                width: fit-content;
                padding:10px;
            }
        </style>
        <script>window.onerror = function (message, source, lineno, colno, error) {
  alert(
    `⚠️ JavaScript Error!\n\n` +
    `Message: ${message}\n` +
    `File: ${source}\n` +
    `Line: ${lineno} | Column: ${colno}\n` +
    `Stack Trace: ${error ? error.stack : 'N/A'}`
  );
  
  // Returning true prevents the error from bubbling up to the browser console
  return true; 
};</script>
    </head>
    <body>
        <div id="status">Signaling Status1: <span id="signalstat">Connecting...</span><br>WebRTC Staus: <span id="rtcstat">No signaling</span></div>
        <script src="reciever.js"></script>

    </body>
</html>
